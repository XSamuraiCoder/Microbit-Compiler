[package]
name = "microbit-compiler"
version = "1.4.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "time" is needed for the startup update-check delay in main.rs
tokio = { version = "1", features = ["process", "fs", "io-util", "macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
which = "6"
zip = "2"
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] } # vendors liblzma so Windows/Linux builds don't need a system copy
flate2 = "1"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[[bin]]
name = "microbit-compiler"
path = "src/main.rs"
